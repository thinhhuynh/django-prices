[tox]
envlist =
    py{310,311,312,313}-django{5,6}
    py{310,311,312,313}-django_master

[gh-actions]
python =
     3.10: py310
     3.11: py311
     3.12: py312
     3.13: py313
[testenv]
pip_pre = true
deps =
    django5: Django>=5.0,<6
    django6: Django>=6.0,<7
    pytest
    pytest-cov
    pytest-django
commands =
    django_master: pip install https://github.com/django/django/archive/master.tar.gz
    pytest --cov --cov-report=
setenv =
    PYTHONPATH=.

[travis]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
unignore_outcomes = True

[travis:env]
DJANGO =
    5: django5
    6: django6
    master: django_master

[pytest]
testpaths = tests
DJANGO_SETTINGS_MODULE = tests.settings
